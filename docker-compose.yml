services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hdrive
      POSTGRES_PASSWORD: hdrive
      POSTGRES_DB: hdrive
    ports: ["5442:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hdrive"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes: ["pgdata:/var/lib/postgresql/data"]

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: hdrive
      MINIO_ROOT_PASSWORD: hdrive-dev-secret
    entrypoint: sh
    command: -c "mkdir -p /data/hdrive /data/hdrive2 && minio server /data --console-address :9001"
    ports: ["9200:9000", "9201:9001"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes: ["miniodata:/data"]

volumes:
  pgdata: {}
  miniodata: {}
