services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hdrive
      # Interpolated from the gitignored root .env on a real host; the default
      # keeps a fresh clone working. NEVER hardcode a real password here — this
      # file is in git.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hdrive}
      POSTGRES_DB: hdrive
    # Bind to loopback ONLY. A bare "5442:5432" publishes on 0.0.0.0, which on a
    # host with a public IP and no firewall exposes Postgres to the internet.
    ports: ["127.0.0.1:5442:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hdrive"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes: ["pgdata:/var/lib/postgresql/data"]

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: hdrive
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-hdrive-dev-secret}
    entrypoint: sh
    command: -c "mkdir -p /data/hdrive /data/hdrive2 && minio server /data --console-address :9001"
    # Loopback only — see the note on postgres above. The console (9201)
    # especially must never be reachable from outside.
    ports: ["127.0.0.1:9200:9000", "127.0.0.1:9201:9001"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes: ["miniodata:/data"]

volumes:
  pgdata: {}
  miniodata: {}
